<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClipDrop</title>
  <style>
    :root {
      --bg: #ebebeb; --card: #fff; --border: #e0e0e0;
      --primary: #07c160; --primary-dark: #06ad56;
      --bubble-send: #95ec69; --bubble-recv: #fff;
      --text: #1a1a1a; --text2: #666; --text3: #999;
      --danger: #fa5151; --shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--primary); color: #fff; padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header h1 { font-size: 17px; font-weight: 600; }
    .header-right { display:flex; gap:8px; align-items:center; }
    .header-right .dot { width:6px; height:6px; border-radius:50%; background:#fff; opacity:.4; transition:opacity .3s; }
    .header-right .dot.on { opacity:1; background:#7ffc9e; }
    .btn-clear {
      background: rgba(255,255,255,.2); border: none; color: #fff;
      padding: 4px 12px; border-radius: 14px; font-size: 13px; cursor: pointer;
    }
    .btn-clear:active { background: rgba(255,255,255,.35); }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 12px 12px 8px;
      display: flex; flex-direction: column; gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .time-divider {
      text-align: center; padding: 8px 0 4px;
      font-size: 11px; color: var(--text3);
    }
    .msg-row {
      display: flex; justify-content: flex-start;
      animation: msgIn .2s ease;
    }
    @keyframes msgIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

    .bubble {
      max-width: 78%; padding: 8px 12px; border-radius: 12px;
      background: var(--bubble-recv); box-shadow: var(--shadow);
      position: relative; word-break: break-all;
    }

    .bubble .msg-text {
      font-size: 15px; line-height: 1.6; white-space: pre-wrap;
      cursor: pointer; user-select: text;
    }
    .bubble .msg-text:active { opacity: .7; }

    .bubble .msg-img {
      max-width: 100%; max-height: 260px; border-radius: 8px;
      cursor: pointer; display: block;
    }

    .msg-time-small {
      font-size: 10px; color: var(--text3); margin-top: 3px; text-align: right;
    }

    /* Pending indicator */
    .msg-row.pending .bubble { opacity: .6; }

    /* Empty */
    .empty {
      flex:1; display:flex; align-items:center; justify-content:center;
      flex-direction:column; color: var(--text3); gap: 8px;
    }
    .empty svg { width:56px; height:56px; opacity:.25; }
    .empty p { font-size: 14px; }

    /* Input Bar */
    .input-bar {
      background: #f7f7f7; border-top: 1px solid var(--border);
      padding: 8px 10px; display: flex; gap: 6px; align-items: flex-end;
    }
    .input-bar textarea {
      flex: 1; border: 1px solid var(--border); border-radius: 20px;
      padding: 8px 14px; font-size: 15px; resize: none;
      outline: none; line-height: 1.5; min-height: 38px; max-height: 100px;
      font-family: inherit; background: #fff;
    }
    .input-bar textarea:focus { border-color: var(--primary); }
    .btn-send {
      background: var(--primary); color: #fff; border: none;
      border-radius: 50%; width: 38px; height: 38px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-send:active { background: var(--primary-dark); }
    .btn-send svg { width: 20px; height: 20px; }
    .btn-img {
      background: none; border: 1px solid var(--border); border-radius: 50%;
      width: 38px; height: 38px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-img svg { width: 20px; height: 20px; color: var(--text2); }
    .btn-img:active { background: #eee; }

    /* Image Preview */
    .img-preview-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.9);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .img-preview-overlay img { max-width: 96vw; max-height: 92vh; border-radius: 4px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.75); color: #fff; padding: 8px 20px;
      border-radius: 20px; font-size: 13px; z-index: 300;
      animation: toastIn .25s ease;
    }
    @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(10px); } }

    /* Drag overlay */
    .drag-overlay {
      position: fixed; inset: 0; background: rgba(7,193,96,.08);
      border: 3px dashed var(--primary); z-index: 150;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--primary); pointer-events: none;
    }

    /* Action popup */
    .action-popup {
      position: fixed; z-index: 250;
      background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.2);
      padding: 6px 0; min-width: 100px;
    }
    .action-popup button {
      display: block; width: 100%; text-align: left; border: none; background: none;
      padding: 10px 18px; font-size: 14px; cursor: pointer; font-family: inherit;
    }
    .action-popup button:active { background: #f0f0f0; }
    .action-popup button.danger { color: var(--danger); }
  </style>
</head>
<body>

<div class="header">
  <h1>ClipDrop</h1>
  <div class="header-right">
    <div class="dot" id="connDot"></div>
    <button class="btn-clear" onclick="clearAll()">清空</button>
  </div>
</div>

<div class="messages" id="messages"></div>

<div class="input-bar">
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <button class="btn-img" onclick="document.getElementById('fileInput').click()" title="选择图片">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
  </button>
  <textarea id="textInput" rows="1" placeholder="输入文字，Ctrl+V 粘贴图片…"></textarea>
  <button class="btn-send" onclick="sendText()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
const API = '/api';
let messages = [];
let pollTimer = null;

// ——— Init ———
init();

async function init() {
  await loadMessages();
  startPoll();
  setupPaste();
  setupDrag();
  setupInput();
}

// ——— Polling ———
async function loadMessages() {
  try {
    const r = await fetch(`${API}/list`, { method: 'POST' });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    mergeMessages(data);
    setConnected(true);
  } catch(e) {
    setConnected(false);
  }
}

function startPoll() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadMessages, 3000);
}

function mergeMessages(serverMsgs) {
  const wasAtBottom = isAtBottom();
  // Keep pending messages not yet confirmed by server
  const pendingMsgs = messages.filter(m => m._pending);
  const stillPending = pendingMsgs.filter(pm =>
    !serverMsgs.some(sm => sm.content === pm.content && Math.abs(sm.ts - pm.ts) < 10000)
  );
  messages = [...serverMsgs, ...stillPending].sort((a, b) => a.ts - b.ts);
  render();
  if (wasAtBottom) scrollToBottom();
}

function setConnected(on) {
  document.getElementById('connDot').classList.toggle('on', on);
}

// ——— API ———
async function postItem(data) {
  try {
    const r = await fetch(`${API}/post`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(await r.text());
    const result = await r.json();
    // Server returns full message list — update immediately
    if (result.messages) mergeMessages(result.messages);
    return result.msg || null;
  } catch(e) {
    toast('发送失败');
    return null;
  }
}

async function deleteItem(id) {
  // Optimistic: remove from local immediately
  messages = messages.filter(m => m.id !== id);
  render();
  const r = await fetch(`${API}/delete`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  // Server returns updated list — sync immediately
  try {
    const result = await r.json();
    if (result.messages) mergeMessages(result.messages);
  } catch(e) {}
}

async function clearAll() {
  if (!confirm('确定清空所有内容？')) return;
  // Optimistic: clear local immediately
  messages = [];
  render();
  const r = await fetch(`${API}/clear`, { method: 'POST' });
  try {
    const result = await r.json();
    if (result.messages) mergeMessages(result.messages);
  } catch(e) {}
}

// ——— Send (optimistic render) ———
async function sendText() {
  const el = document.getElementById('textInput');
  const text = el.value.trim();
  if (!text) return;
  el.value = '';
  el.style.height = 'auto';

  // Optimistic: show immediately
  const pendingId = 'pending-' + Date.now();
  const msg = { id: pendingId, type: 'text', content: text, ts: Date.now(), _pending: true };
  messages.push(msg);
  render();
  scrollToBottom();

  const savedMsg = await postItem({ type: 'text', content: text });
  if (!savedMsg) {
    // Remove pending on failure
    messages = messages.filter(m => m.id !== pendingId);
    render();
  }
}

async function sendImage(blob) {
  toast('压缩中…');
  try {
    const dataUrl = await compressImage(blob);

    // Optimistic: show immediately
    const pendingId = 'pending-' + Date.now();
    const msg = { id: pendingId, type: 'image', content: dataUrl, ts: Date.now(), _pending: true };
    messages.push(msg);
    render();
    scrollToBottom();

    const savedMsg = await postItem({ type: 'image', content: dataUrl });
    if (!savedMsg) {
      messages = messages.filter(m => m.id !== pendingId);
      render();
    }
  } catch(e) {
    toast('图片处理失败');
  }
}

// ——— Image Compression ———
function compressImage(blob, maxPx = 1200, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      let tw = w, th = h;
      if (tw > maxPx || th > maxPx) {
        const scale = maxPx / Math.max(tw, th);
        tw = Math.round(tw * scale);
        th = Math.round(th * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = tw; canvas.height = th;
      canvas.getContext('2d').drawImage(img, 0, 0, tw, th);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(); };
    img.src = URL.createObjectURL(blob);
  });
}

// ——— Render ———
function render() {
  const box = document.getElementById('messages');
  if (messages.length === 0) {
    box.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
      </svg>
      <p>粘贴文字或图片，跨设备即时传输</p>
    </div>`;
    return;
  }

  const sorted = [...messages].sort((a, b) => a.ts - b.ts);
  let html = '';
  let lastTs = 0;

  sorted.forEach(m => {
    if (m.ts - lastTs > 300000) {
      html += `<div class="time-divider">${fmtTime(m.ts)}</div>`;
    }
    lastTs = m.ts;

    let inner = '';
    if (m.type === 'text') {
      inner = `<div class="msg-text" onclick="copyText(this)">${escHtml(m.content)}</div>`;
    } else if (m.type === 'image') {
      inner = `<img class="msg-img" src="${escAttr(m.content)}" onclick="previewImage(this.src)" loading="lazy">`;
    }
    inner += `<div class="msg-time-small">${fmtTimeShort(m.ts)}</div>`;

    const pending = m._pending ? ' pending' : '';
    html += `<div class="msg-row${pending}">
      <div class="bubble" data-id="${m.id}" oncontextmenu="showActions(event,'${m.id}','${m.type}')">${inner}</div>
    </div>`;
  });

  box.innerHTML = html;
}

function fmtTime(ts) {
  return new Date(ts).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtTimeShort(ts) {
  return new Date(ts).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ——— Interactions ———
function copyText(el) {
  const text = el.textContent;
  navigator.clipboard.writeText(text).then(() => toast('已复制'));
}

function previewImage(src) {
  const overlay = document.createElement('div');
  overlay.className = 'img-preview-overlay';
  overlay.innerHTML = `<img src="${escAttr(src)}">`;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function showActions(e, id, type) {
  e.preventDefault();
  removePopup();
  const popup = document.createElement('div');
  popup.className = 'action-popup';
  popup.id = 'actionPopup';
  let btns = '';
  if (type === 'text') btns += `<button onclick="copyMsg('${id}')">复制文字</button>`;
  btns += `<button class="danger" onclick="delMsg('${id}')">删除</button>`;
  popup.innerHTML = btns;
  popup.style.left = Math.min(e.clientX, window.innerWidth - 120) + 'px';
  popup.style.top = Math.min(e.clientY, window.innerHeight - 80) + 'px';
  document.body.appendChild(popup);
  setTimeout(() => document.addEventListener('click', removePopup, { once: true }), 10);
}
function removePopup() { document.getElementById('actionPopup')?.remove(); }
function copyMsg(id) {
  removePopup();
  const m = messages.find(x => x.id === id);
  if (m) navigator.clipboard.writeText(m.content).then(() => toast('已复制'));
}
function delMsg(id) { removePopup(); deleteItem(id); }

function isAtBottom() {
  const box = document.getElementById('messages');
  return box.scrollHeight - box.scrollTop - box.clientHeight < 60;
}
function scrollToBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

// ——— Paste & Drop ———
function setupPaste() {
  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        sendImage(item.getAsFile());
        return;
      }
    }
  });
}

function setupDrag() {
  let dragCounter = 0;
  const body = document.body;
  body.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; showDragOverlay(); });
  body.addEventListener('dragleave', () => { dragCounter--; if(dragCounter<=0){dragCounter=0;hideDragOverlay();} });
  body.addEventListener('dragover', e => e.preventDefault());
  body.addEventListener('drop', e => {
    e.preventDefault(); dragCounter=0; hideDragOverlay();
    const file = e.dataTransfer?.files?.[0];
    if (file && file.type.startsWith('image/')) sendImage(file);
  });
}
function showDragOverlay() {
  if (document.getElementById('dragOverlay')) return;
  const el = document.createElement('div');
  el.id = 'dragOverlay'; el.className = 'drag-overlay';
  el.textContent = '松开发送图片';
  document.body.appendChild(el);
}
function hideDragOverlay() { document.getElementById('dragOverlay')?.remove(); }

// ——— Input ———
function setupInput() {
  const ta = document.getElementById('textInput');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 100) + 'px';
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  });
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (file) sendImage(file);
    e.target.value = '';
  });
}
</script>
</body>
</html>
